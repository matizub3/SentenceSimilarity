[workspace]
name = "sts17-octen-npz"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[tasks]
make-npz = "python create_sts17_octen_npz.py"
run-baseline = "python run_baseline.py"
check-torch = "python -c \"import torch; print('torch:', torch.__version__); print('cuda:', torch.cuda.is_available()); print('device:', torch.cuda.get_device_name(0))\""
check-jax = "python -c \"import jax; print('jax:', jax.__version__); print(jax.devices())\""
check-imports = "python -c \"import os, json, numpy, pandas, matplotlib, jax, torch; from datasets import load_dataset; from sentence_transformers import SentenceTransformer; print('all imports ok')\""

[dependencies]
python = "3.11.*"
numpy = "*"
pytorch-gpu = "*"
datasets = "*"
jax = "*"
pandas = "*"
matplotlib = "*"
scipy = "*"
sentence-transformers = "*"